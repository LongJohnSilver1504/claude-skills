name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate skills, agents, and manifests
        run: node scripts/validate-skills.mjs
      - name: Check version sync
        run: node scripts/sync-version.mjs --check
      - name: Validate plugin, skills, and marketplace manifest
        # Two invocations: `.` resolves to the marketplace manifest and never
        # inspects skills; the plugin.json path validates every SKILL.md
        # (including whether its frontmatter actually parses as YAML).
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .claude-plugin/plugin.json
          claude plugin validate . --strict
