name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate skills, agents, and manifests
        run: node scripts/validate-skills.mjs
      - name: Validate design-craft
        # The sibling plugin has its own invariants and its own validator; nothing
        # in the parent's validator looks at it.
        run: node design-craft/scripts/validate.mjs
      - name: Test hooks
        # Hooks are the plugin's only deterministic guarantees (CLAUDE.md
        # invariant 9); each one is exercised with real stdin payloads.
        # Unquoted on purpose: the shell expands the glob on every Node version
        run: node --test tests/*.test.mjs
      - name: Check version sync
        run: node scripts/sync-version.mjs --check
      - name: Validate plugin, skills, and marketplace manifest
        # Two invocations: `.` resolves to the marketplace manifest and never
        # inspects skills; the plugin.json path validates every SKILL.md
        # (including whether its frontmatter actually parses as YAML).
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .claude-plugin/plugin.json
          claude plugin validate . --strict

  routing-evals:
    # The offline half of the routing gate (every NOT-for skill has a case, every
    # case names real skills) runs in `validate` above, for free, on every PR.
    # This job runs the cases themselves, which need a model and cost ~$4.50 a pass.
    # Without ANTHROPIC_API_KEY it skips loudly instead of passing silently — a
    # green check here means nothing until that secret is set.
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check for credentials
        id: creds
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY is not set — routing evals did NOT run."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Claude Code
        if: steps.creds.outputs.present == 'true'
        run: npm install -g @anthropic-ai/claude-code
      - name: Pipeline routing evals
        if: steps.creds.outputs.present == 'true'
        run: npm run eval
      - name: design-craft routing evals
        if: steps.creds.outputs.present == 'true'
        working-directory: design-craft
        run: npm run eval
